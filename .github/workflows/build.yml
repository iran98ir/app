# =========================================================
# build.yml  —  GitHub Actions برای ساخت APK
# مسیر: .github/workflows/build.yml
# =========================================================

name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. چک‌اوت کد =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== ۲. نصب JDK 17 =====
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۳. ساخت Gradle Wrapper JAR =====
      - name: Setup Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # ===== ۴. کش Gradle =====
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۵. اجازه اجرای gradlew =====
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== ۶. Build APK (Debug) =====
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ===== ۷. Build APK (Release - بدون امضا) =====
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      # ===== ۸. آپلود APK Debug =====
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # ===== ۹. آپلود APK Release =====
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
