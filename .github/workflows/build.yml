# =========================================================
# build.yml  —  GitHub Actions برای ساخت APK امضاشده
# مسیر: .github/workflows/build.yml
# =========================================================
# 📌 Debug و Release هر دو امضا میشن
# 📌 Keystore خودکار ساخته میشه (بدون نیاز به Secrets)
# 📌 APK نهایی امضاشده → بدون هشدار نصب میشه
# =========================================================

name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. چک‌اوت کد =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== ۲. نصب JDK 17 =====
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۳. ساخت Gradle Wrapper JAR =====
      - name: Setup Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      # ===== ۴. کش Gradle =====
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۵. اجازه اجرای gradlew =====
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== ۶. ساخت Keystore خودکار =====
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias moshaver \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Moshaver@2026 \
            -keypass Moshaver@2026 \
            -dname "CN=Moshaver Hamrah, OU=App, O=Vista, L=Tehran, S=Tehran, C=IR"

      # ===== ۷. تنظیم امضا در gradle.properties =====
      - name: Setup signing config
        run: |
          echo "RELEASE_STORE_FILE=../release.keystore" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=Moshaver@2026" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=moshaver" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=Moshaver@2026" >> gradle.properties

      # ===== ۸. Build APK (Debug) =====
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ===== ۹. Build APK (Release) =====
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ===== ۱۰. آپلود APK Debug =====
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoshaverHamrah-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # ===== ۱۱. آپلود APK Release =====
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MoshaverHamrah-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
